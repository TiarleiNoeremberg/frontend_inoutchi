<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>[TESTE] Comparar hero | Inoutchi</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: center; padding: .6rem 1rem; background: #111c33; border-bottom: 1px solid #1e2b4a; }
    header h1 { font-size: 1rem; margin: 0; font-weight: 700; }
    .modos { display: flex; gap: .35rem; }
    .modos button, header a { font: inherit; font-size: .85rem; color: #cbd5e1; background: #1e2b4a; border: 1px solid #2c3d63; padding: .4rem .8rem; border-radius: 999px; cursor: pointer; text-decoration: none; }
    .modos button.ativo { background: #fff; color: #1d4ed8; border-color: #fff; font-weight: 700; }
    .links { margin-left: auto; display: flex; gap: .5rem; }
    main { flex: 1; min-height: 0; display: flex; gap: 1rem; padding: .75rem 1rem 1rem; justify-content: center; }
    .col { min-width: 0; display: flex; flex-direction: column; gap: .4rem; }
    .rotulo { font-size: .85rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
    .rotulo b { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: #38bdf8; color: #0f172a; }
    .rotulo small { font-weight: 400; color: #94a3b8; }
    .quadro { flex: 1; min-height: 0; overflow: hidden; border-radius: .6rem; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    iframe { border: 0; display: block; transform-origin: top left; background: #fff; }
    @media (max-width: 700px) { main { flex-direction: column; overflow-y: auto; } .col { min-height: 70vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Hero: simulador (atual) × animação “Como funciona”</h1>
    <div class="modos" id="modos" role="group" aria-label="Tamanho da tela simulada">
      <button type="button" data-w="1440" class="ativo">Computador</button>
      <button type="button" data-w="820">Tablet</button>
      <button type="button" data-w="390">Celular</button>
    </div>
    <div class="links">
      <a href="index.html" target="_blank" rel="noopener">Abrir A</a>
      <a href="hero-animacao.html" target="_blank" rel="noopener">Abrir B</a>
    </div>
  </header>

  <main id="palco">
    <section class="col">
      <div class="rotulo"><b>A</b>Simulador do app + TV <small>(como está hoje)</small></div>
      <div class="quadro" id="qa"><iframe id="fa" src="index.html" title="Opção A: hero com simulador"></iframe></div>
    </section>
    <section class="col">
      <div class="rotulo"><b>B</b>Animação “Como funciona” <small>(no hero)</small></div>
      <div class="quadro" id="qb"><iframe id="fb" src="hero-animacao.html" title="Opção B: hero com animação"></iframe></div>
    </section>
  </main>

  <script>
    (function () {
      var largura = 1440;
      var pares = [['qa', 'fa'], ['qb', 'fb']].map(function (p) { return { q: document.getElementById(p[0]), f: document.getElementById(p[1]) }; });

      // Cada iframe tem a largura real do aparelho simulado e é reduzido com scale() para caber na metade da tela.
      function ajustar() {
        var palco = document.getElementById('palco');
        var empilhado = getComputedStyle(palco).flexDirection === 'column';
        var disp = empilhado ? palco.clientWidth - 32 : (palco.clientWidth - 32 - 16) / 2;
        var escala = Math.min(1, disp / largura);
        pares.forEach(function (p) {
          var altura = p.q.clientHeight || 600;
          p.q.style.width = (largura * escala) + 'px';
          p.q.parentElement.style.width = (largura * escala) + 'px';
          p.f.style.width = largura + 'px';
          p.f.style.height = (altura / escala) + 'px';
          p.f.style.transform = 'scale(' + escala + ')';
        });
      }

      document.getElementById('modos').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-w]');
        if (!b) return;
        largura = +b.getAttribute('data-w');
        Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('ativo', x === b); });
        ajustar();
        // a largura mudou: os iframes recalculam o layout (media queries) sozinhos; recarrega só para reiniciar a animação
        pares.forEach(function (p) { p.f.contentWindow.location.reload(); });
      });
      window.addEventListener('resize', ajustar);
      ajustar();
      window.addEventListener('load', ajustar);
    })();
  </script>
</body>
</html>
