<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Configuração do Aplicativo</title>

    <link rel="stylesheet" href="../css/app-configuration.css">

</head>

<body>

    <div class="container">

        <h1>Configuração do Aplicativo</h1>

    <div class="info-card">

        <h2>Informações</h2>

        <div class="info-grid">

            <div>
                <span class="info-label">Última atualização</span>
                <span id="updatedAt">--</span>
            </div>

            <div>
                <span class="info-label">Atualizado por</span>
                <span id="updatedBy">--</span>
            </div>

            <div>
                <span class="info-label">Versão Publicada</span>
                <span id="publishedVersion">--</span>
            </div>

        </div>

    </div>

        <div class="card">

            <h2>Banner</h2>

            <div class="form-group checkbox">

                <input
                    type="checkbox"
                    id="bannerEnabled">

                <label for="bannerEnabled">

                    Banner habilitado

                </label>

            </div>

            <div class="form-group">

                <label>ID</label>

                <input
                    type="number"
                    id="bannerId">

            </div>

            <div class="form-group">

                <label>Título</label>

                <input
                    type="text"
                    id="bannerTitle">

            </div>

            <div class="form-group">

                <label>Mensagem</label>

                <textarea
                    id="bannerMessage"
                    rows="5"></textarea>

            </div>

            <div class="form-group">

                <label>Imagem (URL)</label>

                <input
                    type="text"
                    id="bannerImageUrl">

            </div>

            <div class="form-group">

                <label>Texto do botão</label>

                <input
                    type="text"
                    id="bannerButtonText">

            </div>

            <div class="form-group">

                <label>URL do botão</label>

                <input
                    type="text"
                    id="bannerButtonUrl">

            </div>

        </div>

        <div class="buttons">

            <button id="btnReload">

                Recarregar

            </button>

            <button id="btnSave">

                Salvar Configuração

            </button>

        </div>

        <div
            id="status"
            class="status">

        </div>

    </div>

    <script src="../config.js"></script>
    <script src="../js/app-configuration.js"></script>
</body>

</html>
