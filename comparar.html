<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparar as 3 versões | Inoutchi</title>
  <meta name="robots" content="noindex">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #0b1220;
      color: #e5e7eb;
      display: flex;
      flex-direction: column;
    }

    .barra {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
      padding: 10px 14px;
      background: #111a2e;
      border-bottom: 1px solid #1f2a44;
    }

    .barra strong {
      font-size: 13px;
      color: #93c5fd;
      margin-right: 6px;
    }

    .aba,
    .modo {
      border: 1px solid #2b3a5c;
      background: #16223c;
      color: #cbd5e1;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .aba.ativa,
    .modo.ativo {
      background: linear-gradient(90deg, #2563eb, #06b6d4);
      border-color: transparent;
      color: #fff;
    }

    .espaco {
      flex: 1;
    }

    .area {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 6px;
      padding: 6px;
    }

    .quadro {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    .quadro-titulo {
      flex-shrink: 0;
      background: #1f2a44;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .quadro-titulo a {
      color: #93c5fd;
      text-decoration: none;
    }

    .quadro iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: #fff;
    }

    .area.um .quadro:not(.visivel) {
      display: none;
    }
  </style>
</head>

<body>
  <div class="barra">
    <strong>Comparar</strong>
    <button class="aba ativa" data-q="0">1. Site atual (index)</button>
    <button class="aba" data-q="1">2. Só o simulador</button>
    <button class="aba" data-q="2">3. Hero com simulador</button>
    <span class="espaco"></span>
    <button class="modo ativo" data-modo="um">Uma por vez</button>
    <button class="modo" data-modo="lado">Lado a lado</button>
  </div>

  <div class="area um" id="area">
    <div class="quadro visivel">
      <div class="quadro-titulo"><span>1. Site atual</span><a href="index.html" target="_blank">abrir</a></div>
      <iframe src="index.html" title="Site atual" loading="lazy"></iframe>
    </div>
    <div class="quadro">
      <div class="quadro-titulo"><span>2. Só o simulador</span><a href="simulador.html" target="_blank">abrir</a></div>
      <iframe src="simulador.html" title="Só o simulador" loading="lazy"></iframe>
    </div>
    <div class="quadro">
      <div class="quadro-titulo"><span>3. Hero com simulador</span><a href="hero-simulador.html" target="_blank">abrir</a></div>
      <iframe src="hero-simulador.html" title="Hero com simulador" loading="lazy"></iframe>
    </div>
  </div>

  <script>
    var area = document.getElementById('area');
    var quadros = Array.prototype.slice.call(area.querySelectorAll('.quadro'));
    var abas = Array.prototype.slice.call(document.querySelectorAll('.aba'));
    var modos = Array.prototype.slice.call(document.querySelectorAll('.modo'));

    function mostrar(i) {
      quadros.forEach(function (q, k) { q.classList.toggle('visivel', k === i); });
      abas.forEach(function (a, k) { a.classList.toggle('ativa', k === i); });
    }

    abas.forEach(function (a, i) {
      a.addEventListener('click', function () {
        if (area.classList.contains('um')) mostrar(i);
        else quadros[i].scrollIntoView({ behavior: 'smooth', inline: 'center' });
      });
    });

    // No modo lado a lado cada página é desenhada com 1280 px de largura e reduzida, para mostrar o layout de computador.
    function ajustar() {
      var lado = !area.classList.contains('um');
      quadros.forEach(function (q) {
        var f = q.querySelector('iframe');
        if (!lado) {
          f.style.cssText = '';
          return;
        }
        var k = q.clientWidth / 1280;
        var altura = (q.clientHeight - q.querySelector('.quadro-titulo').offsetHeight) / k;
        f.style.cssText = 'width:1280px;height:' + altura + 'px;flex:none;transform:scale(' + k + ');transform-origin:0 0';
      });
    }
    window.addEventListener('resize', ajustar);

    modos.forEach(function (m) {
      m.addEventListener('click', function () {
        var um = m.getAttribute('data-modo') === 'um';
        area.classList.toggle('um', um);
        modos.forEach(function (x) { x.classList.toggle('ativo', x === m); });
        if (um) {
          var atual = abas.findIndex(function (a) { return a.classList.contains('ativa'); });
          mostrar(atual < 0 ? 0 : atual);
        } else {
          quadros.forEach(function (q) { q.classList.add('visivel'); });
        }
        ajustar();
      });
    });
  </script>
</body>

</html>
