<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b2a5b">
    <title>Acesso por Token — Inoutchi</title>
    <link rel="icon" href="assets/images/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul: #1565C0;
            --azul-escuro: #0D47A1;
            --ciano: #00ACC1;
            --texto: #14213d;
            --texto-suave: #5b6b84;
            --linha: #e4eaf3;
            --fundo-suave: #f3f7fc;
            --ok: #10b981;
            --ok-escuro: #059669;
            --aviso: #f59e0b;
            --erro: #ef4444;
            --info: #1e88e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--texto);
            background:
                radial-gradient(circle at 15% 0%, rgba(0, 172, 193, .35), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(30, 136, 229, .35), transparent 50%),
                linear-gradient(165deg, #0b2a5b 0%, #0a3d62 55%, #0b5a6b 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
        }

        .marca {
            display: flex;
            justify-content: center;
        }

        .marca span {
            display: inline-flex;
            padding: 8px 18px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 8px 22px rgba(2, 12, 40, .35);
        }

        .marca img {
            height: 46px;
            width: auto;
            max-width: 60vw;
            object-fit: contain;
        }

        .rodape {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, .62);
            letter-spacing: .2px;
        }

        /* ---------- cartão ---------- */
        .cartao {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(2, 12, 40, .45);
            overflow: hidden;
        }

        .vista[hidden] {
            display: none;
        }

        .topo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 18px;
            color: #fff;
            background: linear-gradient(120deg, var(--azul) 0%, var(--ciano) 100%);
        }

        .topo.saida {
            background: linear-gradient(120deg, #e8590c 0%, #f59e0b 100%);
        }

        .topo .icone {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .2);
            display: grid;
            place-items: center;
        }

        .topo svg {
            width: 24px;
            height: 24px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .topo h1 {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.2;
        }

        .topo p {
            font-size: 13px;
            opacity: .92;
            margin-top: 2px;
        }

        .corpo {
            padding: 16px 18px 18px;
        }

        /* ---------- aluno ---------- */
        .aluno {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            flex: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 20px;
            color: var(--azul-escuro);
            background: linear-gradient(135deg, #e3f0ff, #d4f5fa);
        }

        .aluno .nome {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .aluno .onde {
            font-size: 13px;
            color: var(--texto-suave);
            margin-top: 2px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: var(--texto-suave);
            background: var(--fundo-suave);
            border: 1px solid var(--linha);
        }

        .chip svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chip.destaque {
            color: var(--azul-escuro);
            background: #e8f2ff;
            border-color: #cfe3ff;
        }

        .obs {
            margin-top: 12px;
            font-size: 13px;
            color: var(--texto-suave);
            background: var(--fundo-suave);
            border-left: 3px solid var(--ciano);
            padding: 8px 10px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        /* ---------- avisos e estado ---------- */
        .aviso {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 1.4;
            font-weight: 500;
        }

        .aviso[hidden] {
            display: none;
        }

        .aviso svg {
            flex: none;
            width: 18px;
            height: 18px;
            margin-top: 1px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .aviso.carregando {
            color: var(--azul-escuro);
            background: #e8f2ff;
        }

        .aviso.erro {
            color: #b91c1c;
            background: #fee8e8;
        }

        .aviso.ok {
            color: var(--ok-escuro);
            background: #e3f8f0;
        }

        .passos {
            margin-top: 14px;
            font-size: 14px;
            line-height: 1.5;
            color: var(--texto);
        }

        .passos strong {
            color: var(--azul-escuro);
        }

        /* ---------- botões ---------- */
        .botao {
            width: 100%;
            min-height: 56px;
            margin-top: 16px;
            border: 0;
            border-radius: 16px;
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(120deg, var(--azul) 0%, var(--ciano) 100%);
            box-shadow: 0 10px 22px rgba(21, 101, 192, .35);
            transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
        }

        .botao.saida {
            background: linear-gradient(120deg, #e8590c 0%, #f59e0b 100%);
            box-shadow: 0 10px 22px rgba(232, 89, 12, .32);
        }

        .botao.confirmar {
            background: linear-gradient(120deg, var(--ok-escuro) 0%, var(--ok) 100%);
            box-shadow: 0 10px 22px rgba(16, 185, 129, .35);
        }

        .botao:active {
            transform: scale(.98);
        }

        .botao:disabled {
            opacity: .7;
            cursor: default;
            transform: none;
        }

        .botao[hidden] {
            display: none;
        }

        .botao.secundario {
            color: var(--azul-escuro);
            background: #e8f2ff;
            box-shadow: none;
        }

        .giro {
            display: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .45);
            border-top-color: #fff;
            animation: gira .8s linear infinite;
        }

        .botao:disabled .giro {
            display: inline-block;
        }

        @keyframes gira {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- carregando ---------- */
        .espera {
            padding: 38px 18px;
            text-align: center;
            color: var(--texto-suave);
            font-size: 14px;
        }

        .espera .giro-grande {
            width: 38px;
            height: 38px;
            margin: 0 auto 14px;
            border-radius: 50%;
            border: 4px solid #dbe7f6;
            border-top-color: var(--azul);
            animation: gira .9s linear infinite;
        }

        /* ---------- estado final ---------- */
        .final {
            padding: 26px 20px 22px;
            text-align: center;
        }

        .selo {
            width: 76px;
            height: 76px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
        }

        .selo svg {
            width: 38px;
            height: 38px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .selo.ok {
            background: linear-gradient(135deg, var(--ok-escuro), var(--ok));
            box-shadow: 0 10px 24px rgba(16, 185, 129, .4);
        }

        .selo.info {
            background: linear-gradient(135deg, var(--azul), var(--info));
            box-shadow: 0 10px 24px rgba(30, 136, 229, .4);
        }

        .selo.atencao {
            background: linear-gradient(135deg, #e8590c, var(--aviso));
            box-shadow: 0 10px 24px rgba(245, 158, 11, .4);
        }

        .selo.erro {
            background: linear-gradient(135deg, #b91c1c, var(--erro));
            box-shadow: 0 10px 24px rgba(239, 68, 68, .4);
        }

        .final h2 {
            font-size: 20px;
            font-weight: 800;
            line-height: 1.25;
        }

        .final p {
            margin-top: 8px;
            font-size: 14.5px;
            line-height: 1.5;
            color: var(--texto-suave);
        }

        .final .quem {
            margin-top: 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--texto);
            background: var(--fundo-suave);
            border-radius: 12px;
            padding: 10px 12px;
        }

        @media (prefers-reduced-motion: reduce) {

            .giro,
            .giro-grande {
                animation-duration: 2s;
            }

            .botao {
                transition: none;
            }
        }

        /* telas baixas: tudo precisa caber sem rolar */
        @media (max-height: 640px) {
            .app {
                gap: 8px;
            }

            .marca img {
                height: 34px;
            }

            .marca span {
                padding: 6px 14px;
            }

            .topo {
                padding: 12px 16px;
            }

            .corpo {
                padding: 12px 16px 14px;
            }

            .botao {
                margin-top: 12px;
                min-height: 52px;
            }

            .rodape {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="marca">
            <span><img src="assets/images/LogoMarcaInoutchi5.png" alt="Inoutchi"
                    onerror="this.onerror=null;this.src='./img/LogoMarcaInoutchi5.png'"></span>
        </div>

        <section class="cartao" aria-live="polite">

            <!-- Validando o link -->
            <div class="vista espera" id="vista-carregando">
                <div class="giro-grande" aria-hidden="true"></div>
                Validando o seu acesso...
            </div>

            <!-- Etapa 1: dados e ação -->
            <div class="vista" id="vista-acao" hidden>
                <div class="topo" id="topo">
                    <div class="icone" id="topo-icone" aria-hidden="true"></div>
                    <div>
                        <h1 id="topo-titulo">Acesso do aluno</h1>
                        <p>Olá, <strong id="destinatario"></strong></p>
                    </div>
                </div>
                <div class="corpo">
                    <div class="aluno">
                        <div class="avatar" id="avatar" aria-hidden="true">A</div>
                        <div>
                            <div class="nome" id="alunoNome"></div>
                            <div class="onde" id="onde"></div>
                        </div>
                    </div>
                    <div class="chips">
                        <span class="chip destaque">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                            <span id="validade"></span>
                        </span>
                        <span class="chip" id="chipUso"></span>
                    </div>
                    <p class="obs" id="observacao" hidden></p>

                    <div class="aviso carregando" id="avisoLocal" hidden></div>
                    <div class="aviso erro" id="avisoErro" role="alert" hidden></div>

                    <button class="botao" id="botaoAcao" type="button">
                        <span class="giro" aria-hidden="true"></span>
                        <span id="textoAcao">Continuar</span>
                    </button>
                </div>
            </div>

            <!-- Etapa 2 (saída): aguardando o aluno no portão -->
            <div class="vista" id="vista-espera" hidden>
                <div class="topo saida">
                    <div class="icone" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
                    </div>
                    <div>
                        <h1>Aguardando no portão</h1>
                        <p>Solicitação enviada à escola</p>
                    </div>
                </div>
                <div class="corpo">
                    <p class="passos">
                        O aluno foi avisado. Dirija-se ao portão para encontrá-lo(a).
                        <strong>Toque no botão abaixo só quando o aluno estiver com você.</strong>
                    </p>
                    <div class="aviso erro" id="avisoErro2" role="alert" hidden></div>
                    <button class="botao confirmar" id="botaoConfirmar" type="button">
                        <span class="giro" aria-hidden="true"></span>
                        <span>Estou com o aluno</span>
                    </button>
                </div>
            </div>

            <!-- Resultado final ou problema com o link -->
            <div class="vista final" id="vista-final" hidden>
                <div class="selo ok" id="selo"><svg id="seloIcone" viewBox="0 0 24 24" aria-hidden="true"></svg></div>
                <h2 id="finalTitulo"></h2>
                <p id="finalTexto"></p>
                <p class="quem" id="finalQuem" hidden></p>
                <button class="botao secundario" id="botaoFinal" type="button" hidden>
                    <span id="textoFinal">Tentar novamente</span>
                </button>
            </div>

        </section>

        <p class="rodape">Segurança e organização no fluxo escolar</p>
    </main>

    <script>
        (function () {
            'use strict';

            var API = 'https://api.inoutchi.com';

            var ICONES = {
                entrada: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>',
                saida: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
                ok: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
                info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/>',
                aviso: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
                erro: '<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/>',
                alerta: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>',
                pino: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
                relogio: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
                repete: '<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/>'
            };

            function el(id) { return document.getElementById(id); }
            function svg(nome) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONES[nome] + '</svg>'; }

            var token = new URLSearchParams(window.location.search).get('token');
            var CHAVE_ETAPA = 'inoutchi.token.aguardando.' + (token || '');
            var operacao = '';
            var dadosAluno = {};

            // ---------- armazenamento (opcional: pode estar bloqueado) ----------
            function lembrarEtapa(valor) {
                try {
                    if (valor) localStorage.setItem(CHAVE_ETAPA, String(Date.now()));
                    else localStorage.removeItem(CHAVE_ETAPA);
                } catch (e) { /* sem armazenamento: o servidor continua sendo a verdade */ }
            }
            function etapaLembrada() {
                try { return !!localStorage.getItem(CHAVE_ETAPA); } catch (e) { return false; }
            }

            // ---------- vistas ----------
            var VISTAS = ['vista-carregando', 'vista-acao', 'vista-espera', 'vista-final'];
            function mostrar(id) {
                VISTAS.forEach(function (v) { el(v).hidden = (v !== id); });
            }

            function aviso(idAviso, texto, tipo) {
                var a = el(idAviso);
                if (!texto) { a.hidden = true; a.innerHTML = ''; return; }
                a.className = 'aviso ' + (tipo || 'erro');
                a.innerHTML = svg(tipo === 'carregando' ? 'pino' : 'alerta') + '<span></span>';
                a.lastChild.textContent = texto;
                a.hidden = false;
            }

            // Resultado final. tipo: ok | info | atencao | erro
            function final(tipo, titulo, texto, opcoes) {
                opcoes = opcoes || {};
                el('selo').className = 'selo ' + tipo;
                el('seloIcone').innerHTML = ICONES[opcoes.icone || (tipo === 'ok' ? 'ok' : tipo === 'info' ? 'info' : tipo === 'atencao' ? 'aviso' : 'erro')];
                el('finalTitulo').textContent = titulo;
                el('finalTexto').textContent = texto;
                var quem = el('finalQuem');
                if (opcoes.aluno) {
                    quem.textContent = opcoes.aluno;
                    quem.hidden = false;
                } else {
                    quem.hidden = true;
                }
                var b = el('botaoFinal');
                b.hidden = !opcoes.tentarNovamente;
                mostrar('vista-final');
            }

            function ocupado(botao, sim) {
                botao.disabled = !!sim;
            }

            // ---------- erros do servidor ----------
            // O servidor responde de dois jeitos: {erro: "TOKEN_UTILIZADO", mensagem} nos endpoints de validação e
            // {erro: "texto", mensagem: "texto"} nos de operação. Por isso o texto também é conferido.
            function classificar(status, dados) {
                var codigo = String((dados && dados.erro) || '');
                var texto = String((dados && (dados.mensagem || dados.erro)) || '').toLowerCase();
                // 1. códigos específicos
                if (codigo === 'TOKEN_UTILIZADO') return 'utilizado';
                if (codigo === 'TOKEN_REVOGADO') return 'revogado';
                if (codigo === 'TOKEN_EXPIRADO') return 'expirado';
                // 2. pelo texto (o aviso de "revogado" também cita "utilizado": ele vem primeiro)
                if (/revogad|cancelad/.test(texto)) return 'revogado';
                if (/expirad/.test(texto)) return 'expirado';
                if (/utilizad/.test(texto)) return 'utilizado';
                // 3. o resto
                if (codigo === 'FORA_DA_GEOFENCE' || status === 403) return 'fora-da-area';
                if (codigo === 'TOKEN_INVALIDO' || status === 404 || status === 401) return 'invalido';
                return 'outro';
            }

            function mostrarProblemaDoLink(tipo) {
                var aluno = dadosAluno.alunoNome ? 'Aluno: ' + dadosAluno.alunoNome : '';
                if (tipo === 'utilizado') {
                    lembrarEtapa(false);
                    final('info', 'Este link já foi utilizado', 'Ele só vale uma vez e não pode ser usado de novo. Se precisar de outro acesso, peça um novo link ao responsável.', { aluno: aluno });
                } else if (tipo === 'revogado') {
                    lembrarEtapa(false);
                    final('atencao', 'Este link não está mais disponível', 'Ele foi cancelado pelo responsável ou já foi utilizado. Se precisar de outro acesso, peça um novo link.', { aluno: aluno });
                } else if (tipo === 'expirado') {
                    lembrarEtapa(false);
                    final('atencao', 'Este link expirou', 'O prazo para usar este link terminou. Peça um novo link ao responsável.', { aluno: aluno, icone: 'relogio' });
                } else {
                    final('erro', 'Link inválido', 'Não encontramos este acesso. Confira se o link foi copiado por inteiro e tente de novo.');
                }
            }

            // ---------- inicialização ----------
            function preencher(d) {
                dadosAluno = d;
                operacao = d.operacoesPermitidas;

                var nome = d.alunoNome || 'Aluno';
                el('destinatario').textContent = d.destinatario || 'visitante';
                el('alunoNome').textContent = nome;
                el('avatar').textContent = nome.trim().charAt(0).toUpperCase() || 'A';

                var onde = [d.escolaNome, d.salaNome && d.salaNome !== 'Sem sala' ? d.salaNome : null].filter(Boolean);
                el('onde').textContent = onde.join(' · ') || 'Escola';

                var validade = 'Sem prazo informado';
                if (d.dataExpiracao) {
                    var data = new Date(d.dataExpiracao);
                    if (!isNaN(data.getTime())) {
                        validade = 'Válido até ' + data.toLocaleString('pt-BR', {
                            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                        }).replace(',', '');
                    }
                }
                el('validade').textContent = validade;
                el('chipUso').textContent = d.reutilizavel ? 'Vários usos' : 'Uso único';

                var obs = (d.observacao || '').trim();
                el('observacao').hidden = !obs;
                el('observacao').textContent = obs;

                var topo = el('topo');
                var botao = el('botaoAcao');
                if (operacao === 'ENTRADA') {
                    topo.className = 'topo';
                    el('topo-icone').innerHTML = svg('entrada');
                    el('topo-titulo').textContent = 'Entrada do aluno';
                    el('textoAcao').textContent = 'Confirmar entrada';
                    botao.className = 'botao';
                } else if (operacao === 'SAIDA') {
                    topo.className = 'topo saida';
                    el('topo-icone').innerHTML = svg('saida');
                    el('topo-titulo').textContent = 'Retirada do aluno';
                    el('textoAcao').textContent = 'Solicitar saída';
                    botao.className = 'botao saida';
                } else {
                    throw new Error('operacao-invalida');
                }
            }

            async function inicializar() {
                mostrar('vista-carregando');
                if (!token) {
                    final('erro', 'Link incompleto', 'O endereço parece estar cortado. Abra novamente o link que você recebeu.');
                    return;
                }
                try {
                    var resposta = await fetch(API + '/api/tokens/validar/' + encodeURIComponent(token));
                    var dados = await resposta.json().catch(function () { return {}; });

                    if (!resposta.ok) {
                        mostrarProblemaDoLink(classificar(resposta.status, dados));
                        return;
                    }
                    preencher(dados);

                    // Saída em duas etapas: quem já pediu e recarregou a página volta direto ao portão.
                    if (operacao === 'SAIDA' && etapaLembrada()) {
                        mostrar('vista-espera');
                    } else {
                        mostrar('vista-acao');
                    }
                } catch (erro) {
                    if (erro && erro.message === 'operacao-invalida') {
                        final('erro', 'Operação não reconhecida', 'Este link não pode ser usado nesta página. Peça um novo link ao responsável.');
                    } else {
                        final('atencao', 'Sem conexão', 'Não conseguimos falar com o servidor. Verifique a internet e tente novamente.', { tentarNovamente: true });
                    }
                }
            }

            // ---------- localização (a posição exata não sai do aparelho) ----------
            function distanciaMetros(lat1, lon1, lat2, lon2) {
                var R = 6371000;
                var rad = function (g) { return g * Math.PI / 180; };
                var dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
                var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }

            // O backend informa as cercas que valem para a operação DESTE token (o token vai no corpo, nunca na URL);
            // aqui se mede a distância até elas e só "geofenceId + distanciaMetros" segue para o servidor, que decide
            // se está dentro. Sem as cercas, cai no formato antigo (coordenadas) e o servidor responde o erro certo.
            async function montarLocalizacao(latitude, longitude) {
                try {
                    var r = await fetch(API + '/api/tokens/cercas', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token })
                    });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    var cercas = await r.json();
                    if (!Array.isArray(cercas) || cercas.length === 0) throw new Error('sem cercas');

                    var melhor = null;
                    cercas.forEach(function (c) {
                        if (typeof c.id !== 'number' || typeof c.latitude !== 'number' ||
                            typeof c.longitude !== 'number' || !(c.raio > 0)) return;
                        var d = distanciaMetros(latitude, longitude, c.latitude, c.longitude);
                        var folga = d - c.raio;
                        if (melhor === null || folga < melhor.folga) melhor = { id: c.id, distancia: d, folga: folga };
                    });
                    if (melhor === null) throw new Error('cercas inválidas');

                    // Arredonda PARA CIMA: nunca transforma "fora" em "dentro".
                    return { geofenceId: melhor.id, distanciaMetros: Math.ceil(melhor.distancia) };
                } catch (e) {
                    return { latitude: latitude, longitude: longitude };
                }
            }

            function obterPosicao() {
                aviso('avisoLocal', 'Obtendo a sua localização para validar a área da escola...', 'carregando');
                return new Promise(function (resolve, reject) {
                    if (!navigator.geolocation) {
                        reject(new Error('Este navegador não consegue informar a localização.'));
                        return;
                    }
                    navigator.geolocation.getCurrentPosition(resolve, function (e) {
                        var msg = 'Não foi possível obter a sua localização.';
                        if (e.code === 1) msg = 'Permita o acesso à localização no navegador para continuar.';
                        else if (e.code === 2) msg = 'Não foi possível obter a sua localização. Verifique o GPS e a internet.';
                        else if (e.code === 3) msg = 'A localização demorou demais. Tente novamente.';
                        reject(new Error(msg));
                    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
                });
            }

            // ---------- ações ----------
            // Falha de uma operação: problema do link vira tela própria; o resto é um aviso e o botão continua ativo.
            function tratarFalha(status, dados, idAviso) {
                var tipo = classificar(status, dados);
                if (tipo === 'utilizado' || tipo === 'revogado' || tipo === 'expirado' || tipo === 'invalido') {
                    mostrarProblemaDoLink(tipo);
                    return;
                }
                if (tipo === 'fora-da-area') {
                    aviso(idAviso, 'Você está fora da área da escola. Aproxime-se do portão e tente novamente.');
                    return;
                }
                var texto = (dados && (dados.mensagem || dados.erro)) || 'Não foi possível concluir agora. Tente novamente.';
                aviso(idAviso, String(texto));
            }

            async function chamarOperacao(tipo) {
                var posicao = await obterPosicao();
                var localizacao = await montarLocalizacao(posicao.coords.latitude, posicao.coords.longitude);
                aviso('avisoLocal', '');
                var corpo = Object.assign({ token: token, tipo: tipo }, localizacao);
                var resposta = await fetch(API + '/api/tokens/executar-operacao', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(corpo)
                });
                var dados = await resposta.json().catch(function () { return {}; });
                return { ok: resposta.ok, status: resposta.status, dados: dados };
            }

            async function aoToqueNaAcao() {
                var botao = el('botaoAcao');
                aviso('avisoErro', '');
                ocupado(botao, true);
                try {
                    var r = await chamarOperacao(operacao);
                    if (!r.ok) {
                        aviso('avisoLocal', '');
                        tratarFalha(r.status, r.dados, 'avisoErro');
                        return;
                    }
                    if (operacao === 'ENTRADA') {
                        lembrarEtapa(false);
                        final('ok', 'Entrada confirmada', 'A entrada de ' + (dadosAluno.alunoNome || 'o aluno') + ' foi registrada. Você já pode fechar esta página.');
                    } else {
                        lembrarEtapa(true);
                        mostrar('vista-espera');
                    }
                } catch (erro) {
                    aviso('avisoLocal', '');
                    var offline = erro instanceof TypeError;
                    aviso('avisoErro', offline ? 'Sem conexão com o servidor. Verifique a internet e tente novamente.' : erro.message);
                } finally {
                    ocupado(botao, false);
                }
            }

            async function aoConfirmarPosse() {
                var botao = el('botaoConfirmar');
                aviso('avisoErro2', '');
                ocupado(botao, true);
                try {
                    var resposta = await fetch(API + '/api/presencas/confirmar-saida/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token })
                    });
                    var dados = await resposta.json().catch(function () { return {}; });
                    if (!resposta.ok || dados.sucesso === false) {
                        var texto = String((dados && dados.mensagem) || '').toLowerCase();
                        if (resposta.status === 409 && /nenhuma solicita|n[aã]o h[aá] solicita/.test(texto)) {
                            // A solicitação deixou de existir (cancelada pelo responsável ou já confirmada): recomeça.
                            lembrarEtapa(false);
                            mostrar('vista-acao');
                            aviso('avisoErro', 'A solicitação anterior não está mais ativa. Solicite a saída novamente.');
                            return;
                        }
                        tratarFalha(resposta.status, dados, 'avisoErro2');
                        return;
                    }
                    lembrarEtapa(false);
                    final('ok', 'Retirada confirmada', dados.mensagem || 'A retirada foi confirmada. Você já pode fechar esta página.');
                } catch (erro) {
                    aviso('avisoErro2', 'Sem conexão com o servidor. Verifique a internet e tente novamente.');
                } finally {
                    ocupado(botao, false);
                }
            }

            el('botaoAcao').addEventListener('click', aoToqueNaAcao);
            el('botaoConfirmar').addEventListener('click', aoConfirmarPosse);
            el('botaoFinal').addEventListener('click', inicializar);
            el('botaoFinal').insertAdjacentHTML('afterbegin', svg('repete').replace('<svg ', '<svg style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round" '));

            inicializar();
        })();
    </script>
</body>
